<!--
  In-chat fallback INTAKE widget.
  Rendered by Claude when the skill is invoked WITHOUT a prepared INTAKE.md / .docx / Notion page.
  Submit produces a structured payload Claude serializes into INTAKE.md before running the validator.
-->
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Data-analysis engagement details</span>
  </div>
  <div class="elicit-body">

    <div class="elicit-group">
      <label class="elicit-question">What's the engagement name?</label>
      <textarea class="elicit-textarea" data-name="engagement" placeholder="e.g. NWM Privates Data Dictionary"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Which domain profile applies?</label>
      <div class="elicit-pills" data-name="profile" data-multi="false">
        <button type="button" class="elicit-pill" data-value="simcorp">SimCorp Dimension</button>
        <button type="button" class="elicit-pill" data-value="generic">Generic data-engineering</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What's the deliverable name pattern + version?</label>
      <textarea class="elicit-textarea" data-name="deliverable_name_and_version" placeholder="e.g. Nicola_Privates_Data_Dictionary_v12_2026_05_20.xlsx"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Who's the audience? (named people + roles)</label>
      <textarea class="elicit-textarea" data-name="audience" placeholder="e.g. Erhan Yildirim (Migration), Diana Schinkel (AttrConfig), Chris Wong (PELP)"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Which output formats are required?</label>
      <div class="elicit-pills" data-name="output_formats" data-multi="true">
        <button type="button" class="elicit-pill" data-value="xlsx">XLSX primary</button>
        <button type="button" class="elicit-pill" data-value="docx">DOCX companion</button>
        <button type="button" class="elicit-pill" data-value="notion">Notion §x.y</button>
        <button type="button" class="elicit-pill" data-value="mermaid">Mermaid lineage</button>
        <button type="button" class="elicit-pill" data-value="build_script">Build script (.py)</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Drop or list every source file (absolute paths + one-line role each)</label>
      <div class="elicit-files" data-name="inputs_files">
        <label class="elicit-dropzone">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M16.5 13a.5.5 0 0 1 .5.5v2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-2a.5.5 0 0 1 1 0v2a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 1 .5-.5M10 3a.5.5 0 0 1 .374.168l4 4.5.059.082a.5.5 0 0 1-.732.65l-.075-.068L10.5 4.814V13.5a.5.5 0 0 1-1 0V4.814L6.374 8.332a.5.5 0 0 1-.748-.664l4-4.5.08-.071A.5.5 0 0 1 10 3"/></svg>
          <span>Choose files</span>
          <input type="file" multiple>
        </label>
      </div>
      <textarea class="elicit-textarea" data-name="inputs_text" placeholder="OR paste here:&#10;path | role (canonical/supplementary/extract/template/documentation) | description&#10;/path/to/file1.xlsx | canonical | AM field roster&#10;/path/to/file2.csv | documentation | SimCorp Help corpus"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What's in scope?</label>
      <textarea class="elicit-textarea" data-name="scope_in" placeholder="e.g. PE + VC + PD + Infra + Mortgages, Mar 31 2026 extracts only"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What's explicitly out of scope?</label>
      <textarea class="elicit-textarea" data-name="scope_out" placeholder="e.g. Wealth-only portfolios except NWM510 mixed"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Pre-map at least 3 output columns to their source files</label>
      <textarea class="elicit-textarea" data-name="source_truth_map_stub" placeholder="AM Field Name → v22 ENRICHED col A&#10;AM Field Description → SimCorp_Help_Structured.csv (verbatim)&#10;Calculation → Pricing Doc §3.1-§3.4"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Proposed schema (tab names + column lists)</label>
      <textarea class="elicit-textarea" data-name="proposed_schema" placeholder="Tab: Full_Dictionary (master)&#10;  Row = one AM field&#10;  Cols: AM Field Name | AM Field Description | Imported Y/N | Calculated Y/N | Calculation Description | Source File | Source Locator | ...&#10;Tab: Private_Equity (per-vertical)&#10;  Row = one AM field with PE-portfolio fill rate > 0&#10;  Cols: same 26 as master"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Slicing rule — how are sub-tabs cut from the data?</label>
      <textarea class="elicit-textarea" data-name="slicing_rule" placeholder="e.g. per-vertical = column union across portfolios containing that vertical; NWM510 (mixed) feeds PE+VC+Infra"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Any SME questions to embed inline?</label>
      <textarea class="elicit-textarea" data-name="sme_questions" placeholder="None / OR list: SQ-1 Sebastian Infra FX | SQ-2 KKR DCIF rounding | PQ-1 Pamela servicer prefix | ..."></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Citation format required for every cell</label>
      <textarea class="elicit-textarea" data-name="citation_format" placeholder="e.g. {verbatim quote} (file path, §section); [GAP: no source found] for missing"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What counts as 'done'? (verification criteria)</label>
      <textarea class="elicit-textarea" data-name="verification_criteria" placeholder="- All non-blank descriptions have non-blank Source column&#10;- Per-vertical row count matches column union from inputs&#10;- Zero invented descriptions&#10;- SME Q&A coverage = 100%"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Notion target page §</label>
      <textarea class="elicit-textarea" data-name="notion_target" placeholder="e.g. §18.34 — new sub-page under Solution Architecture"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Any open questions you want surfaced before the engagement starts?</label>
      <textarea class="elicit-textarea" data-name="open_questions_for_dan" placeholder="Optional. Validator surfaces these to chat."></textarea>
    </div>

  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Skip</button>
    <button type="button" class="elicit-submit">Lock the engagement</button>
  </div>
</form>
